[project]
name = "rsev_utilities"
version = "2.0.0"
description = "A modular runtime utility framework for python"
authors = [
    { name = "MrRSEV", email = "info@rsev.de" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "pyyaml>=6.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["rsev_utilities*"]

[project.entry-points."rsev.plugins"]
my_plugin = "my_package.plugin:MyPlugin"
